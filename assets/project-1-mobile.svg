<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title">
<title id="title">Universal Learning GPS: Learning roadmaps, skill gaps, and a clearer next step.</title>
<defs>
<radialGradient id="planet" cx="30%" cy="22%" r="80%"><stop stop-color="#fff0d5"/><stop offset=".22" stop-color="#ffbdaf"/><stop offset=".55" stop-color="#ad7ce6"/><stop offset=".85" stop-color="#53417e"/><stop offset="1" stop-color="#252038"/></radialGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7c5aa"/><stop offset=".5" stop-color="#bca5ff"/><stop offset="1" stop-color="#6f59b5"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#8b61cf" stop-opacity=".3"/><stop offset="1" stop-color="#8b61cf" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#cbb7f4" opacity=".12"/></pattern>
</defs><style>
text{font-family:Arial,Helvetica,sans-serif}
.orbit{animation:orbit 36s linear infinite;transform-origin:0px 0px}
.reverse{animation:orbit 48s linear infinite reverse;transform-origin:0px 0px}
.float{animation:float 7s ease-in-out infinite}
.twinkle{animation:twinkle 5s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes twinkle{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.orbit,.reverse,.float,.twinkle{animation:none!important}}
</style>
<rect x="0" y="0" width="600" height="370" rx="24" fill="#e7dfff"/>
<text x="34" y="42" fill="#6146a2" font-size="13" font-weight="700" letter-spacing="2">01  /  LEARNING TOOLS</text>
<text x="32" y="101" fill="#171327" font-size="41" font-weight="800" letter-spacing="-1.5">Universal</text>
<text x="32" y="147" fill="#171327" font-size="41" font-weight="800" letter-spacing="-1.5">Learning GPS</text>
<text x="34" y="202" fill="#6146a2" font-size="21" font-weight="400" >Learning roadmaps, skill gaps,</text>
<text x="34" y="230" fill="#6146a2" font-size="21" font-weight="400" >and a clearer next step.</text>
<text x="34" y="323" fill="#6146a2" font-size="16" font-weight="600" >Next.js  /  React  /  TypeScript</text>
<circle cx="542" cy="320" r="23" fill="#6146a2" />
<text x="542" y="328" fill="#e7dfff" font-size="28" font-weight="400" text-anchor="middle">↗</text>
</svg>
